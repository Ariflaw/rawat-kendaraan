<style>
:root {
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-subtle: #f1f5f9;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #cbd5e1;
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --primary-light: #e0f2fe;

  --ok-bg: #16a34a;
  --ok-text: #ffffff;
  --wa-bg: #d97706;
  --wa-text: #ffffff;
  --wa-light: #fef3c7;
  --er-bg: #dc2626;
  --er-text: #ffffff;
  --er-light: #fee2e2;
  --nu-bg: #64748b;
  --nu-text: #ffffff;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

[data-theme="dark"] {
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --bg-subtle: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --primary: #38bdf8;
  --primary-hover: #7dd3fc;
  --primary-light: #0c4a6e;

  --ok-bg: #16a34a;
  --wa-bg: #f59e0b;
  --wa-light: #78350f;
  --er-bg: #ef4444;
  --er-light: #7f1d1d;
  --nu-bg: #475569;
}

* { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
body { margin: 0; background: var(--bg-main); color: var(--text-main); padding-bottom: 84px; }
.w { max-width: 600px; margin: auto; padding: 12px; }

.app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.app-title { font-size: 17px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 6px; }
.theme-btn { background: var(--bg-subtle); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 99px; font-weight: 600; font-size: 11px; cursor: pointer; color: var(--text-main); }

.b { display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; white-space: nowrap; line-height: 1.2; box-shadow: 0 1px 2px rgba(0,0,0,0.08); max-width: 100%; text-overflow: ellipsis; overflow: hidden; }
.b.ok { background: var(--ok-bg); color: var(--ok-text); }
.b.wa { background: var(--wa-bg); color: var(--wa-text); }
.b.er { background: var(--er-bg); color: var(--er-text); animation: pulse-red 2s infinite; }
.b.nu { background: var(--nu-bg); color: var(--nu-text); }

@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
  70% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
  100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
}

.alert-box { background: var(--er-light); border: 1.5px solid var(--er-bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.alert-box.wa { background: var(--wa-light); border-color: var(--wa-bg); }
.alert-title { font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; color: var(--er-bg); }
.alert-box.wa .alert-title { color: var(--wa-bg); }

.c { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }

.r { display: flex; gap: 8px; flex-wrap: wrap; }
.r > label { flex: 1 1 100%; min-width: 100%; font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
.r input, .r select { width: 100%; }

@media(min-width: 500px) {
  .r > label { flex: 1 1 calc(50% - 8px); min-width: 120px; }
}

input, select, button { font-size: 13px; border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); min-height: 38px; outline: none; }
input[type="date"] { max-width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
button { cursor: pointer; font-weight: 600; }
button.p { background: var(--primary); color: #fff; border: none; font-weight: 700; }

.btn-outline { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.15s ease; min-height: 32px; }
.btn-outline:active { background: var(--bg-subtle); transform: scale(0.98); }

.bar { height: 6px; background: var(--bg-subtle); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bar i.ok { background: var(--ok-bg); }
.bar i.wa { background: var(--wa-bg); }
.bar i.er { background: var(--er-bg); }

.g { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; font-size: 12px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; align-items: stretch; }
.mu { color: var(--text-muted); font-size: 11px; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.plate { display: inline-block; background: var(--text-main); color: var(--bg-card); border-radius: 5px; padding: 1px 6px; font-weight: 800; letter-spacing: 1px; font-size: 12px; margin: 2px 0; }
.rp { font-variant-numeric: tabular-nums; }
.it { border-bottom: 1px solid var(--border-color); padding: 8px 0; }
.it:last-child { border: 0; }
.it .top { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
.it .det { display: none; grid-template-columns: 1fr; gap: 6px; margin: 8px 0 0 28px; }
.it.on .det { display: grid; }

details summary { cursor: pointer; font-weight: 700; font-size: 13px; min-height: 32px; display: flex; align-items: center; }
details[open] summary { margin-bottom: 6px; }

nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  background: var(--bg-card); border-top: 1px solid var(--border-color);
  display: flex; justify-content: space-around;

}

  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; background: none; border: none; padding: 4px 1px; min-height: 48px;
  font-size: 10px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  border-radius: 10px; transition: all 0.12s ease; touch-action: manipulation;

html { width: 100%; max-width: 100%; overflow-x: hidden; overflow-x: clip; -webkit-text-size-adjust: 100%; }

.w { width: 100%; }
.app-header { gap: 8px; flex-wrap: wrap; }

.mt { margin-top: 12px; }

.cph { flex-wrap: wrap; row-gap: 6px; }
.cpn { flex: 1 1 140px; min-width: 0; overflow-wrap: break-word; }

.km { padding: 14px; }
.kmtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.kmv { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 2px; letter-spacing: -0.5px; }
.kmv span { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-left: 3px; letter-spacing: 0; }

.vc { padding: 0; overflow: hidden; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.vc:active { transform: scale(.99); }
.vc.er { border-color: var(--er-bg); }

.vph img { width: 100%; height: 100%; object-fit: cover; display: block; }

.seg { display: inline-flex; background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: 99px; padding: 2px; flex: none; }
.seg button { border: none; background: none; min-height: 28px; padding: 2px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--text-muted); }

.vl { cursor: pointer; padding: 10px; }

.vlt { display: flex; gap: 10px; align-items: center; }

.vlt .thumb.e { display: grid; place-items: center; font-size: 26px; background: var(--bg-subtle); }
.vlt .vname { font-size: 14px; }
.vl .vbadges { margin-top: 8px; }
.vc.hero { cursor: default; }
.vc.hero:active { transform: none; }
.hero .vph { height: 190px; }
.hero .vname { font-size: 18px; }

details summary::-webkit-details-marker { display: none; }
details summary::after { content: '›'; margin-left: auto; font-size: 20px; line-height: 1; color: var(--text-muted); transition: transform .15s ease; }

details.stnk summary { gap: 8px; font-size: 13px; }
.stnk .sl { min-width: 0; }

.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bk { flex: none; width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; display: grid; place-items: center; background: var(--bg-card); box-shadow: var(--shadow-sm); }
.bt { min-width: 0; flex: 1; }

.it, .it:last-child { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--bg-main); transition: border-color .12s ease, background .12s ease; }

  -webkit-appearance: none; appearance: none; flex: none; width: 26px; height: 26px; min-height: 0; padding: 0;
  border: 2px solid var(--text-muted); border-radius: 8px; background: var(--bg-card); display: grid; place-items: center;
  cursor: pointer; box-shadow: none; transition: background .12s ease, border-color .12s ease, transform .12s ease;
}

.eih { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color); font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }

.topbar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 6px 12px 6px 6px; gap: 10px; box-shadow: var(--shadow-sm); }

.cr { border-left: 4px solid var(--border-color); padding: 10px 12px; margin-bottom: 8px; }

    return { i: 0, nx: null, sisa: 1e9 + sd, pct: Math.max(0, Math.min(100, 100 * sd / maxDays)), k: k0, t: t0, ageText: ageText0, timeOnly: true };
  }
  
  var i = iv(c), nx = (c.last || 0) + i, sisaKm = nx - (S ? S.km : 0);
  var pctKm = i ? Math.max(0, Math.min(100, 100 * sisaKm / i)) : 100;
  
  var kmK = sisaKm < 0 ? 'er' : (sisaKm <= Math.max(300, i * .1) ? 'wa' : 'ok');
  var kmT = sisaKm < 0 ? 'Terlambat ' + nk(-sisaKm) : sisaKm == 0 ? 'Ganti sekarang' : sisaKm.toLocaleString('id-ID') + ' km lagi';

  var timeK = 'ok', timeT = '', daysUsed = 0;
  if (c.lastDate && c.mBulan > 0) {
    daysUsed = dayDiff(c.lastDate);
    var maxDays0 = Math.round(c.mBulan * 30.4);
    var sisaDays = maxDays0 - daysUsed;
    if (sisaDays < 0) {
      timeK = 'er';
      var mLate = Math.abs(Math.round(sisaDays / 30.4)) || 1;
      timeT = 'Usia lewat ' + mLate + ' bln';
    } else if (sisaDays <= 30) {
      timeK = 'wa';
      timeT = 'Usia ' + sisaDays + ' hari lagi';
    } else {
      timeT = Math.round(sisaDays/30.4) + ' bln lagi';
    }
  }

  var finalK = 'ok', finalT = kmT;
  if (kmK === 'er' || timeK === 'er') {
    finalK = 'er';
    finalT = (kmK !== 'er' && timeK === 'er') ? timeT : kmT;
  } else if (kmK === 'wa' || timeK === 'wa') {
    finalK = 'wa';
    finalT = (kmK !== 'wa' && timeK === 'wa') ? timeT : kmT;
  }

  var ageText = partAgeStr(c.lastDate);
  return { i: i, nx: nx, sisa: sisaKm, pct: pctKm, k: finalK, t: finalT, ageText: ageText };
}

var lvOf = function(p) { return p >= 90 ? 'er' : p >= 65 ? 'wa' : 'ok'; };
function urgPct(c, s) {
  if (!isSet(c)) return -1;
  var km = 0, tm = 0;
  if (s.i > 0) km = Math.min(100, Math.max(0, (S.km - c.last) / s.i * 100));
  if (c.mBulan > 0 && c.lastDate) {
    var due = addMonths(c.lastDate, c.mBulan), sisaH = -dayDiff(due), used = dayDiff(c.lastDate), tot = used + sisaH;
    tm = tot > 0 ? Math.min(100, Math.max(0, used / tot * 100)) : 100;
  }
  return Math.max(km, tm);
}
function compLv(c, s) {
  if (!isSet(c) || (!(s.i > 0) && !(c.mBulan > 0 && c.lastDate))) return 'nu';
  return lvOf(urgPct(c, s));
}

var dt = function(d) {
  if (!d) return '';
  var parsed = new Date(d + 'T00:00:00');
  return isNaN(parsed.getTime()) ? '' : parsed.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
};

function lateStr(d) {
  var a = new Date(d + 'T00:00:00'), n = new Date(today() + 'T00:00:00');
  if (isNaN(a.getTime()) || a >= n) return '';
  var y = n.getFullYear() - a.getFullYear(), m = n.getMonth() - a.getMonth(), dd = n.getDate() - a.getDate();
  if (dd < 0) { m--; dd += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  var w = Math.floor(dd / 7), r = dd % 7;
  if (y > 0) return y + ' thn' + (m ? ' ' + m + ' bln' : '');
  if (m > 0) return m + ' bln' + (w ? ' ' + w + ' mgg' : '');
  if (dd >= 7) return w + ' mgg' + (r ? ' ' + r + ' hr' : '');
  return dd + ' hr';
}

function pj() {
  if (!S || !S.info) return { t: 'Belum diisi', k: 'wa', tgl: '' };
  var d = S.info.pajakTgl;
  if (!d) return { t: 'Belum diisi', k: 'wa', tgl: '' };
  var sv = S.info.pajakStatus || '';
  
  if (sv == 'lunas') {
    var dNext = addMonths(d, 12);
    var nNext = Math.round((new Date(dNext + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
    var tNext = nNext < 0 ? 'Telat ' + lateStr(dNext) : nNext <= 30 ? nNext + ' hari lagi' : nNext + ' hari lagi';
    var kNext = nNext < 0 ? 'er' : nNext <= 30 ? 'wa' : 'ok';
    return { t: tNext, k: kNext, n: nNext, paid: true, tgl: dNext };
  }

  var n = Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
  if (n < 0) {
    return { t: 'Telat ' + lateStr(d), k: 'er', n: n, unpaid: true, tgl: d };
  }
  var r = n <= 30 ? { t: n + ' hari lagi', k: 'wa', n: n, tgl: d } : { t: n + ' hari lagi', k: 'ok', n: n, tgl: d };
  if (sv == 'belum') r.unpaid = true;
  return r;
}

function dash() {
  var fmtSisa = function(n) { var x = Math.abs(n); return x >= 60 ? Math.round(x / 30.4) + ' bulan' : x + ' hari'; };
  var lv = lvOf;
  var block = function(ttl, val, k, pct, note) { return '<div class="mt">' +
    '<div class="row"><span class="mtl">' + ttl + '</span><b class="tx ' + k + '">' + val + '</b></div>' +
    '<div class="bar"><i class="' + k + '" style="width:' + pct + '%"></i></div>' +
    '<div class="mu">' + note + '</div></div>'; };
  var ring = dashView == 'list';

  var calc = function(c, s) {
    var kmUsed = Math.max(0, S.km - c.last), i = s.i;
    var kmPct = i ? Math.min(100, kmUsed / i * 100) : 0;
    var due = '', tPct = 0, tT = '';
    if (c.mBulan > 0 && c.lastDate) {
      due = addMonths(c.lastDate, c.mBulan);
      var sisaH = -dayDiff(due), used = dayDiff(c.lastDate), tot = used + sisaH;
      tPct = tot > 0 ? Math.min(100, Math.max(0, used / tot * 100)) : 100;
      tT = sisaH < 0 ? 'terlewat ' + fmtSisa(sisaH) : sisaH == 0 ? 'jatuh tempo hari ini' : 'sisa ' + fmtSisa(sisaH);
    }
    var pctMax = Math.max(kmPct, tPct);
    return { kmUsed: kmUsed, i: i, kmPct: kmPct, due: due, tPct: tPct, tT: tT, pctMax: pctMax, cardLv: (!i && !due) ? 'nu' : lv(pctMax) };
  };

  var L = S.comps.map(function(c) { var s = st(c); return { c: c, s: s, m: isSet(c) ? calc(c, s) : null }; });
  if (dashSort == 'urgent') L.sort(function(a, b) { return ((b.m ? b.m.pctMax : -1) - (a.m ? a.m.pctMax : -1)) || (a.s.sisa - b.s.sisa); });
  else if (dashSort == 'km') L.sort(function(a, b) { return a.s.sisa - b.s.sisa; });

  var toggle = '<div class="row" style="margin:2px 0 10px;">' +
    '<div><b style="font-size:15px;">Jadwal Komponen</b><div class="mu">' + S.comps.length + ' komponen' + (ring ? ' · ketuk untuk detail' : '') + '</div></div>' +
    '<div class="seg"><button data-dview="list" class="' + (ring ? 'on' : '') + '" aria-label="Tampilan ringkas" title="Ringkas">' + IC_LIST + '</button><button data-dview="full" class="' + (ring ? '' : 'on') + '" aria-label="Tampilan lengkap" title="Lengkap">' + IC_CARD + '</button></div>' +
  '</div>' +
  '<div class="row sortrow"><span class="mu">Urutkan</span>' +
    '<div class="seg txt"><button data-sort="urgent" class="' + (dashSort == 'urgent' ? 'on' : '') + '">Mendesak</button><button data-sort="km" class="' + (dashSort == 'km' ? 'on' : '') + '">Sisa KM</button><button data-sort="manual" class="' + (dashSort == 'manual' ? 'on' : '') + '">Urutan saya</button></div>' +
  '</div>';

  var cards = L.map(function(item) {
    var c = item.c, s = item.s, m = item.m;
    if (!m) {
      var iv0 = (s.i > 0 ? 'Interval ' + nk(s.i) : 'Hanya usia') + (c.mBulan > 0 ? ' · batas ' + c.mBulan + ' bulan' : '');
      if (ring) return '<div class="c cr nu"><div class="row crh"><b class="crn">' + E(c.name) + '</b><span class="b nu">Belum diatur</span></div><div class="mu crl"><span>' + iv0 + '</span></div></div>';
      return '<div class="c cp nu"><div class="row cph"><b class="cpn">' + E(c.name) + '</b><span class="b nu">Belum diatur</span></div>' +
        '<div class="mu" style="margin-top:8px;">Belum ada data penggantian terakhir. Isi KM dan tanggal ganti di tab Komponen, atau pakai tombol "Atur titik awal servis".</div>' +
        '<div class="mu" style="margin-top:4px;">' + iv0 + '</div></div>';
    }

    var kmUsed = m.kmUsed, i = m.i, kmPct = m.kmPct, due = m.due, tPct = m.tPct, tT = m.tT, pctMax = m.pctMax, cardLv = m.cardLv;
    var kmT = s.sisa < 0 ? 'terlambat ' + nk(-s.sisa) : s.sisa == 0 ? 'ganti sekarang' : 'sisa ' + nk(s.sisa);

    var kmBlock = i > 0
      ? block('🛣️ Jarak tempuh', kmT, lv(kmPct), kmPct, 'Ganti di ' + nk(s.nx) + ' · interval ' + nk(i) + ' · ' + Math.round(kmPct) + '% terpakai')
      : (c.mBulan > 0 ? '' : '<div class="mu" style="margin-top:10px;">Interval KM dan batas usia belum diisi.</div>');
    var tmBlock = '';
    if (due) tmBlock = block('⏱️ Usia pemakaian', tT, lv(tPct), tPct, 'Ganti sebelum ' + dt(due) + ' · batas ' + c.mBulan + ' bulan · ' + Math.round(tPct) + '% terpakai');
    else if (c.mBulan > 0) tmBlock = '<div class="mu" style="margin-top:10px;">Batas usia ' + c.mBulan + ' bulan. Isi tanggal ganti terakhir di tab Komponen agar terhitung.</div>';

    var nm = String(c.name || '').trim().toLowerCase();
    var hb = (S.hist || []).filter(function(h) { return String(h.comp || '').trim().toLowerCase() == nm && (+h.price || 0) > 0; })
      .sort(function(a, b) { return String(b.date).localeCompare(String(a.date)) || (b.km || 0) - (a.km || 0); })[0];
    var extra = [
      c.spec ? 'Merek/Jenis dipakai: ' + E(c.spec) : '',
      c.brand ? 'Merek terakhir: ' + E(c.brand) : '',
      hb ? 'Harga terakhir: ' + rp(hb.price) + ' (' + dt(hb.date) + ')' : '',
      c.note ? 'Catatan: ' + E(c.note) : ''
    ].filter(Boolean);
    var extraBlock = extra.length ? '<div class="mu crx">' + extra.join('<br>') + '</div>' : '';

    var infoBox = '<div class="cpi">' +
        '<div><div class="mu">Terakhir ganti</div>' +
          '<b>' + (c.lastDate ? dt(c.lastDate) : 'Tanggal belum diisi') + '</b>' +
          '<div class="mu">' + [c.lastDate ? ago(c.lastDate) : '', (i > 0 || c.last > 0) ? nk(c.last) : ''].filter(Boolean).join(' · ') + '</div></div>' +
        '<div><div class="mu">Sudah dipakai</div>' +
          '<b>' + (i > 0 ? nk(kmUsed) : (c.lastDate ? (s.ageText || '0 hari') : '-')) + '</b>' +
          '<div class="mu">' + (i > 0 ? (c.lastDate ? (s.ageText || '0 hari') : 'sejak diganti') : 'berdasarkan usia') + '</div></div>' +
      '</div>';

    if (ring) {
      var info = [];
      if (i > 0) { info.push('Ganti di ' + nk(s.nx)); if (due) info.push('atau sebelum ' + dt(due)); }
      else if (due) info.push('Ganti sebelum ' + dt(due) + ' · berdasarkan usia');
      else info.push(c.mBulan > 0 ? 'Isi tanggal ganti terakhir' : 'Interval belum diisi');
      return '<details class="c cr ' + cardLv + '" data-kid="j' + c.id + '" ' + (openK.has('j' + c.id) ? 'open' : '') + '><summary>' +
          '<div class="row crh"><b class="crn">' + E(c.name) + '</b><span class="b ' + cardLv + '">' + s.t + '</span></div>' +
          '<div class="bar"><i class="' + cardLv + '" style="width:' + pctMax + '%"></i></div>' +
          '<div class="mu crl"><span>' + info.join(' ') + '</span><span class="more o">Detail ▾</span><span class="more cl">Tutup ▴</span></div>' +
        '</summary>' +
        '<div class="crd">' + infoBox + kmBlock + tmBlock + extraBlock + '</div></details>';
    }

    return '<div class="c cp ' + cardLv + '"><div class="row cph"><b class="cpn">' + E(c.name) + '</b><span class="b ' + cardLv + '">' + s.t + '</span></div>' +
      infoBox + kmBlock + tmBlock + extraBlock + '</div>';
  }).join('');

  return kmBox() + setupBox() + toggle + cards;
}

var hy = function(h) { return /^\d{4}/.test(h.date || '') ? String(h.date).slice(0, 4) : ''; };
var hisYears = function() {
  var yrs = [];
  (S.hist || []).forEach(function(h) { var y = hy(h); if (y && yrs.indexOf(y) === -1) yrs.push(y); });
  return yrs.sort(function(a, b) { return b.localeCompare(a); });
};
var shortRp = function(n) { return n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + 'jt' : n >= 1000 ? Math.round(n / 1000) + 'rb' : String(n); };
var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

function hisStat(F, years) {
  if (!F.length) return '<div class="c mu">Belum ada data servis' + (hisYear != 'all' ? ' di tahun ' + hisYear : '') + '.</div>';
  var key = function(h) { return h.date + '|' + h.km + '|' + (h.shop || ''); };
  var total = F.reduce(function(a, h) { return a + (+h.price || 0); }, 0);
  var svcSet = new Set(); F.forEach(function(h) { svcSet.add(key(h)); });
  var nSvc = svcSet.size, nItem = F.length;

  var parts = new Map();
  F.forEach(function(h) {
    var k = String(h.comp || '').trim().toLowerCase(); if (!k) return;
    var p = parts.get(k); if (!p) { p = { n: String(h.comp).trim(), c: 0, t: 0, last: '' }; parts.set(k, p); }
    p.c++; p.t += (+h.price || 0);
    if (String(h.date) >= p.last) { p.last = String(h.date); p.n = String(h.comp).trim(); }
  });
  var P = Array.from(parts.values());
  var byCost = P.filter(function(p) { return p.t > 0; }).sort(function(a, b) { return b.t - a.t; });
  var byFreq = P.slice().sort(function(a, b) { return b.c - a.c || b.t - a.t; });

  var bars = function(rows, color) {
    var mx = Math.max.apply(Math, rows.map(function(r) { return r.v; }).concat([1]));
    return rows.map(function(r) {
      return '<div class="hb"><div class="row"><span class="hn">' + E(r.n) + '</span><b class="hv">' + r.t + '</b></div><div class="bar"><i style="width:' + Math.max(3, r.v / mx * 100) + '%; background:' + color + '"></i></div><div class="mu">' + r.s + '</div></div>';
    }).join('');
  };

  var shops = new Map();
  F.forEach(function(h) {
    var nm = String(h.shop || '').trim() || 'Tanpa nama bengkel';
    var o = shops.get(nm); if (!o) { o = { n: nm, t: 0, k: new Set() }; shops.set(nm, o); }
    o.t += (+h.price || 0); o.k.add(key(h));
  });
  var SH = Array.from(shops.values()).sort(function(a, b) { return b.t - a.t; }).slice(0, 5);

  var cols, ttl;
  if (hisYear == 'all' && years.length > 1) {
    cols = years.slice().reverse().map(function(y) {
      return { l: y, v: F.filter(function(h) { return hy(h) == y; }).reduce(function(a, h) { return a + (+h.price || 0); }, 0) };
    });
    ttl = 'Biaya per tahun';
  } else {
    var y0 = hisYear != 'all' ? hisYear : (years[0] || '');
    cols = BLN.map(function(l, i) {
      return { l: l, v: F.filter(function(h) { return hy(h) == y0 && (parseInt(String(h.date).slice(5, 7), 10) - 1) == i; }).reduce(function(a, h) { return a + (+h.price || 0); }, 0) };
    });
    ttl = 'Biaya per bulan' + (y0 ? ' (' + y0 + ')' : '');
  }
  var mx0 = Math.max.apply(Math, cols.map(function(c) { return c.v; }).concat([1]));
  var chart = '<div class="cols">' + cols.map(function(c) {
    return '<div class="col"><div class="cv">' + (c.v ? shortRp(c.v) : '') + '</div><div class="cb ' + (c.v ? '' : 'z') + '" style="height:' + (c.v ? Math.max(4, Math.round(c.v / mx0 * 96)) : 2) + 'px"></div><div class="cl">' + c.l + '</div></div>';
  }).join('') + '</div>';

  var top = byCost[0], fr = byFreq[0];
  var insight = [
    top ? 'Paling banyak menghabiskan biaya: <b>' + E(top.n) + '</b> (' + rp(top.t) + ', ' + Math.round(top.t / Math.max(total, 1) * 100) + '% dari total).' : '',
    fr && fr.c > 1 ? 'Paling sering diganti: <b>' + E(fr.n) + '</b> (' + fr.c + '×, rata-rata ' + rp(Math.round(fr.t / fr.c)) + ' per pembelian).' : ''
  ].filter(Boolean);

  return '<div class="sc">' +
      '<div><div class="mu">Total Biaya</div><b>' + rp(total) + '</b></div>' +
      '<div><div class="mu">Jumlah Servis</div><b>' + nSvc + '×</b></div>' +
      '<div><div class="mu">Total Item/Part</div><b>' + nItem + '</b></div>' +
      '<div><div class="mu">Rata-rata per Servis</div><b>' + rp(Math.round(total / Math.max(nSvc, 1))) + '</b></div>' +
    '</div>' +
    (insight.length ? '<div class="c ins"><span class="chd">Ringkasan</span>' + insight.map(function(t) { return '<div>' + t + '</div>'; }).join('') + '</div>' : '') +
    '<div class="c"><span class="chd">' + ttl + '</span>' + chart + '</div>' +
    '<div class="c"><span class="chd">Part dengan biaya terbesar</span>' +
      (byCost.length ? bars(byCost.slice(0, 8).map(function(p) { return { n: p.n, v: p.t, t: rp(p.t), s: p.c + '× dibeli · rata-rata ' + rp(Math.round(p.t / p.c)) + ' · ' + Math.round(p.t / Math.max(total, 1) * 100) + '% dari total' }; }), 'var(--primary)') : '<div class="mu" style="margin-top:8px;">Belum ada harga yang tercatat.</div>') +

  }
  else if (t.id == 'exp') {
    var q_csv = function(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var csv = 'Tanggal,KM,Komponen,Harga,Tempat,Catatan,Merek\n' + (S.hist||[]).map(function(h) { return [h.date, h.km, h.comp, h.price, h.shop, h.note, h.brand].map(q_csv).join(','); }).join('\n');
    try { var u = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), l = document.createElement('a'); l.href = u; l.download = 'riwayat-servis.csv'; document.body.appendChild(l); l.click(); l.remove(); } catch(x) { alert('Ekspor tidak didukung di sini. Data tersimpan di Supabase.'); }
  }
  else if (t.id == 'imp') {
    var raw = prompt('Tempel isi CSV (tanpa header: Tanggal,KM,Komponen,Harga,Tempat,Catatan,Merek):'); if (!raw) return;
    raw.split('\n').forEach(function(l) {
      if (!l.trim() || /^Ingrese|^"?tanggal/i.test(l)) return;
      var p_csv = (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).map(function(s) { return s.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'); });
      if (p_csv[0] && p_csv[2]) (S.hist=S.hist||[]).push({ id: uid(), date: p_csv[0], km: +p_csv[1] || 0, comp: p_csv[2], price: +p_csv[3] || 0, shop: p_csv[4] || '', note: p_csv[5] || '', brand: p_csv[6] || '' });
    }); 
    recalc(); save(); draw();
  }
});

document.addEventListener('input', function(e) {
  var t = e.target; if (!t.classList || !t.classList.contains('rp')) return;
  var v = t.value, c = t.selectionStart == null ? v.length : t.selectionStart, d = v.slice(0, c).replace(/\D/g, '').length, f = fn(v);
  t.value = f; var p = 0, k = 0; while (p < f.length && k < d) { if (/\d/.test(f[p])) k++; p++; }
  try { t.setSelectionRange(p, p); } catch(x){}
});

document.addEventListener('change', function(e) {
  var t = e.target, tr = t.closest ? t.closest('[data-id]') : null;
  
  if (t.id === 'notaFile' && t.files[0]) {
    var file = t.files[0];
    var reader = new FileReader();
    var statusEl = $('#scanStatus');
    var btnScan = $('#btnScanNota');
    
    if (statusEl) statusEl.style.display = 'block';
    if (btnScan) btnScan.disabled = true;

    reader.onload = async function(uploadEvent) {
      var base64Image = uploadEvent.target.result;
      try {
        var response = await fetch('/api/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Image: base64Image })
        });
        var result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || 'Gagal memproses nota.');

        var data = result.data;
        if (data.date) { var sdEl = $('#sd'); if (sdEl) sdEl.value = data.date; }
        if (data.km && data.km > 0) { var skEl = $('#sk'); if (skEl) skEl.value = data.km; }
        if (data.shop) { var ssEl = $('#ss'); if (ssEl) ssEl.value = data.shop; }
        if (data.note) { var snEl = $('#sn'); if (snEl) snEl.value = data.note; }

        var allFetchedItems = (data.items || []).concat(data.extraItems || []);
        allFetchedItems.forEach(function(item) {
          var matchedComp = (S.comps || []).find(function(c) {
            return c.name.toLowerCase().includes(item.name.toLowerCase()) || item.name.toLowerCase().includes(c.name.toLowerCase());
          });
          if (matchedComp) {
            var chk = document.querySelector('[data-ck="' + matchedComp.id + '"]');
            if (chk) {
              chk.checked = true;
              chk.closest('.it').classList.add('on');
            }
            var prInput = document.querySelector('[data-pr="' + matchedComp.id + '"]');
            if (prInput) prInput.value = fn(item.price);
          } else {
            var xlist = $('#xlist');
            if (xlist) {
              xlist.insertAdjacentHTML('beforeend', xRow(xlist.querySelectorAll('.xi').length + 1, true));
              var lastRow = xlist.lastElementChild;
              var nameInp = lastRow.querySelector('.xn');
              var priceInp = lastRow.querySelector('.xp');
              if (nameInp) nameInp.value = item.name;
              if (priceInp) priceInp.value = fn(item.price);
            }
          }
        });

        svcCount();
        toast('ok', 'Scan Berhasil', 'Data nota berhasil diekstrak oleh AI Gemini.');
      } catch (err) {
        toast('er', 'Gagal Scan Nota', err.message);
      } finally {
        if (statusEl) statusEl.style.display = 'none';
        if (btnScan) btnScan.disabled = false;
        t.value = '';
      }
    };
    reader.readAsDataURL(file);
    return;
  }

  if (t.dataset.hi) { 
    var h = (S.hist||[]).find(function(x) { return x.id == t.dataset.hi; }), f = t.dataset.hf; 
    if (h) { 
      h[f] = f == 'price' ? pn(t.value) : t.value.trim(); 
      recalc();
      save(); 
    } 
    return; 
  }
  if (t.dataset.kmv !== undefined) { var n = pn(t.value); if (n != S.km) { S.km = n; S.kmTgl = today(); } save(); return; }
  if (t.dataset.hg) { var f_hg = t.dataset.hg, ids = t.dataset.ids.split(','); if (f_hg == 'date' && !t.value) return; (S.hist||[]).forEach(function(h) { if (ids.indexOf(h.id) !== -1) h[f_hg] = f_hg == 'km' ? (+t.value || 0) : t.value; }); recalc(); save(); return; }
  if (t.dataset.ck !== undefined) {
    var it_el = t.closest('.it'); if (it_el) it_el.classList.toggle('on', t.checked);
    svcCount();
    return;
  }
  if (t.classList && t.classList.contains('xn')) { svcCount(); return; }
  
  if (tr && t.dataset.f) {
    var c_comp = (S.comps||[]).find(function(c) { return c.id == tr.dataset.id; }), f_comp = t.dataset.f;
    if (!c_comp) return;
    if (f_comp == 'next') { 
      c_comp.last = Math.max(0, pn(t.value) - iv(c_comp)); 
      c_comp.set = true; 
    } 
    else { 
      c_comp[f_comp] = ['name', 'mode', 'lastDate', 'spec'].indexOf(f_comp) !== -1 ? t.value : pn(t.value); 
      if (f_comp == 'last' || f_comp == 'lastDate') c_comp.set = true;
    }
    save();
    if (f_comp == 'name') { var kn = tr.querySelector('.kn'); if (kn) kn.textContent = t.value; }
    if (f_comp == 'mode') draw();
  }
  else if (['merek', 'model', 'kat', 'cool', 'kunci', 'trans', 'bbm', 'drv'].indexOf(t.dataset.i) !== -1) { catChange(t.dataset.i, t.value); }
  else if (['cc', 'stnkMode', 'stnkTerbit', 'pajakStatus'].indexOf(t.dataset.i) !== -1) {
    var k_i = t.dataset.i, v_i = t.value, I_i = S.info = S.info || {}; I_i[k_i] = v_i;
    if (k_i == 'stnkMode' && v_i == 'cus') { var d_std = STD(); if (I_i.bStnk == null) I_i.bStnk = String(d_std.stnk); if (I_i.bTnkb == null) I_i.bTnkb = String(d_std.tnkb); if (I_i.bSw == null) I_i.bSw = String(d_std.sw); if (I_i.bLain == null) I_i.bLain = '0'; }
    if (k_i == 'stnkTerbit' && v_i) { var pts_i = v_i.split('-').map(Number); I_i.stnkTgl = new Date(Date.UTC(pts_i[0] + 5, pts_i[1] - 1, pts_i[2])).toISOString().slice(0, 10); }
    save(); draw();
  }
  else if (t.dataset.i == 'tipe') { S.info.tipe = t.value; S.motor = t.value == '__m' ? (S.info.tipeM || S.motor) : t.value; save(); draw(); }
  else if (t.dataset.i == 'tipeM') { S.info.tipeM = t.value; S.motor = t.value; save(); }
  else if (t.id == 'pf' && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function() {
      var im = new Image();
      im.onload = function() {
        var r = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        var g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
        g.drawImage(im, 0, 0, c.width, c.height);
        var q = 0.85, url = c.toDataURL('image/jpeg', q);
        while (url.length > 350000 && q > 0.45) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        S.info.foto = url; save(); draw();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(t.files[0]);
  }
  else if (t.dataset.i) {
    S.info = S.info || {};
    S.info[t.dataset.i] = ['rangka', 'mesin'].indexOf(t.dataset.i) !== -1 ? t.value.toUpperCase() : (['hargaBeli', 'pajak', 'bStnk', 'bTnkb', 'bSw', 'bLain'].indexOf(t.dataset.i) !== -1 ? String(pn(t.value)) : t.value);
    save();
  }
});

var drag = null;
function dragStep() {
  var d = drag; if (!d) return;
  var c = d.card;
  var apply = function() { var lt = c.getBoundingClientRect().top - (d.dy || 0); d.dy = (d.y - d.grab) - lt; c.style.transform = 'translateY(' + d.dy + 'px)'; };
  apply();
  for (var g = 0; g < 4; g++) {
    var r = c.getBoundingClientRect(), cy = r.top + r.height / 2;
    var nx = c.nextElementSibling, pv = c.previousElementSibling;
    if (nx && nx.classList.contains('kc') && cy > nx.getBoundingClientRect().top + nx.offsetHeight / 2) { nx.after(c); apply(); }
    else if (pv && pv.classList.contains('kc') && cy < pv.getBoundingClientRect().top + pv.offsetHeight / 2) { pv.before(c); apply(); }
    else break;
  }
}
document.addEventListener('pointerdown', function(e) {
  var h = e.target.closest ? e.target.closest('[data-drag]') : null; if (!h) return;
  var card = h.closest('.kc'); if (!card) return;
  e.preventDefault();
  document.querySelectorAll('.kc[open]').forEach(function(x) { x.removeAttribute('open'); });
  var r = card.getBoundingClientRect();
  drag = { card: card, id: e.pointerId, y: e.clientY, dy: 0, grab: Math.min(Math.max(e.clientY - r.top, 16), Math.max(16, r.height - 16)) };
  drag.timer = setInterval(function() {
    if (!drag) return;
    if (drag.y < 110) window.scrollBy(0, -10); else if (drag.y > innerHeight - 130) window.scrollBy(0, 10); else return;
    dragStep();
  }, 16);
  try { h.setPointerCapture(e.pointerId); } catch (x) {}
  card.classList.add('dragging'); document.body.classList.add('dragging');
  dragStep();
});
document.addEventListener('pointermove', function(e) {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault(); drag.y = e.clientY; dragStep();
}, { passive: false });

var dragEnd = function(e) {
  if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.id)) return;
  var d = drag; drag = null; clearInterval(d.timer);
  d.card.classList.remove('dragging'); d.card.style.transform = ''; document.body.classList.remove('dragging');
  var ids = Array.prototype.slice.call(document.querySelectorAll('.kc')).map(function(x) { return x.dataset.id; });
  var map = new Map((S.comps || []).map(function(c) { return [c.id, c]; }));
  var next = ids.map(function(id) { return map.get(id); }).filter(Boolean);
  if (next.length == (S.comps || []).length && next.some(function(c, i) { return c !== S.comps[i]; })) {
    S.comps = next; save();
    toast('ok', 'Urutan disimpan', 'Pilih "Urutan saya" di tab Jadwal untuk memakainya');
  }
  draw();
};
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);

document.addEventListener('toggle', function(e) {
  var d = e.target, k = d && d.dataset && d.dataset.kid;
  if (!k) return;
  if (d.open) openK.add(k); else openK.delete(k);
}, true);

document.addEventListener('focusin', function(e) {
  if (e.target.matches && e.target.matches('input, select, textarea')) document.body.classList.add('typing');
});
document.addEventListener('focusout', function() {
  setTimeout(function() {
    var a = document.activeElement;
    if (!(a && a.matches && a.matches('input, select, textarea'))) document.body.classList.remove('typing');
  }, 150);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLb();
  if (e.key === 'Enter' && e.target && e.target.id === 'km') { var b = $('#setkm'); if (b) b.click(); }
});

$('#btnTheme').addEventListener('click', function() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('#btnTheme').textContent = isDark ? '🌙' : '☀️';
});

window.addEventListener('focus', function() {
  if (!_busy) loadDataFromSheet(false);
});
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && !_busy) {
    loadDataFromSheet(false);
  }
});

draw();
loadDataFromSheet(false);
</script>
