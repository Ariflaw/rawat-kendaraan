<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rawat Kendaraan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-main: #f8fafc; --bg-card: #ffffff; --bg-subtle: #f1f5f9; --text-main: #0f172a;
  --text-muted: #64748b; --border-color: #cbd5e1; --primary: #0284c7; --primary-hover: #0369a1;
  --primary-light: #e0f2fe; --ok-bg: #16a34a; --ok-text: #ffffff; --wa-bg: #d97706;
  --wa-text: #ffffff; --wa-light: #fef3c7; --er-bg: #dc2626; --er-text: #ffffff;
  --er-light: #fee2e2; --nu-bg: #64748b; --nu-text: #ffffff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  -webkit-tap-highlight-color: transparent; box-sizing: border-box;
}
[data-theme="dark"] {
  --bg-main: #0f172a; --bg-card: #1e293b; --bg-subtle: #334155; --text-main: #f8fafc;
  --text-muted: #94a3b8; --border-color: #334155; --primary: #38bdf8; --primary-hover: #7dd3fc;
  --primary-light: #0c4a6e; --wa-light: #78350f; --er-light: #7f1d1d;
}
* { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
body { margin: 0; background: var(--bg-main); color: var(--text-main); padding-bottom: 84px; }
.w { max-width: 600px; margin: auto; padding: 12px; }
.app-header { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); cursor: pointer; position: relative; }
.logo svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sdot { display: none; position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--bg-main); background: var(--text-muted); }
.sdot.ok { display: block; background: var(--ok-bg); }
.sdot.er { display: block; background: var(--er-bg); }
.sdot.busy { display: block; background: var(--wa-bg); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.app-title { font-size: 21px; font-weight: 800; margin: 0; }
.theme-btn { width: 42px; height: 42px; border-radius: 50%; font-size: 18px; border: 1px solid var(--border-color); background: var(--bg-subtle); color: var(--text-main); cursor: pointer; display: grid; place-items: center; }
.c { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.mu { color: var(--text-muted); font-size: 11px; }
input, select, button { font-size: 13px; border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); min-height: 38px; outline: none; }
button { cursor: pointer; font-weight: 600; }
button.p { background: var(--primary); color: #fff; border: none; font-weight: 700; }
.plate { display: inline-block; background: var(--text-main); color: var(--bg-card); border-radius: 5px; padding: 1px 6px; font-weight: 800; font-size: 12px; }
.b { display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
.b.ok { background: var(--ok-bg); color: #fff; } .b.wa { background: var(--wa-bg); color: #fff; } .b.er { background: var(--er-bg); color: #fff; }
.toast { position: fixed; left: 50%; top: 12px; transform: translate(-50%, -150%); z-index: 300; width: calc(100% - 24px); max-width: 420px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--bg-card); border: 1.5px solid var(--border-color); box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.2,.9,.3,1.2); }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.ti { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; flex: none; }
.ti.ok { background: var(--ok-bg); } .ti.er { background: var(--er-bg); }
</style>
</head>
<body>
<div class="w">
  <div class="app-header">
    <div class="brand">
      <div class="logo" id="logoBtn" title="Sinkronkan data"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg><span id="sync" class="sdot"></span></div>
      <h1 class="app-title">Rawat Kendaraan</h1>
    </div>
    <button class="theme-btn" id="btnTheme">🌙</button>
  </div>
  <div id="v"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// Masukkan kredensial Supabase Anda di sini
const SUPABASE_URL = "https://xjrszqdptyqpzlgfgtrq.supabase.co/"; // URL Supabase Anda[cite: 3]
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqcnN6cWRwdHlxcHpsZ2ZndHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTQ1MDgsImV4cCI6MjEwODI3MDUwOH0.kZSn1Q1gtispQolLUv0zjjndLQogGnvxZ6spXjs4FOE"; // Anon Key Anda

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let R = { vehicles: [] };
const $ = s => document.querySelector(s);

function syncStatus(type, msg) {
  const dot = $('#sync');
  if (!dot) return;
  dot.className = 'sdot ' + type;
  dot.title = msg;
}

function toast(kind, title, sub) {
  const t = $('#toast');
  if (!t) return;
  t.className = `toast show ${kind}`;
  t.innerHTML = `<div class="ti ${kind}">${kind==='ok'?'✓':'!'}</div><div><b>${title}</b><div class="mu">${sub||''}</div></div>`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadData() {
  syncStatus('busy', 'Memuat data...');
  try {
    const { data, error } = await supabaseClient
      .from('app_state')
      .select('data')
      .eq('id', 'default_user')
      .single();

    if (error && error.code !== 'PGRST116') throw error;
    if (data && data.data) {
      R = data.data;
      syncStatus('ok', 'Tersinkron dengan Supabase');
    } else {
      syncStatus('ok', 'Database baru');
    }
  } catch (err) {
    syncStatus('er', 'Gagal memuat');
    toast('er', 'Gagal Sinkron', 'Menggunakan data lokal.');
  }
  render();
}

async function saveData() {
  syncStatus('busy', 'Menyimpan...');
  try {
    const { error } = await supabaseClient
      .from('app_state')
      .upsert({ id: 'default_user', data: R, updated_at: new Date().toISOString() });

    if (error) throw error;
    syncStatus('ok', 'Tersimpan di Supabase');
    toast('ok', 'Tersimpan', 'Data berhasil diperbarui di Supabase');
  } catch (err) {
    syncStatus('er', 'Gagal menyimpan');
    toast('er', 'Gagal Menyimpan', err.message);
  }
}

function render() {
  const v = $('#v');
  const vehicles = R.vehicles || [];

  let html = `<div class="c">
    <div class="row"><b>Daftar Kendaraan (${vehicles.length})</b><button class="p" id="addBtn">+ Tambah</button></div>
  </div>`;

  vehicles.forEach((item, idx) => {
    html += `<div class="c">
      <div class="row">
        <b>${item.motor || 'Kendaraan ' + (idx + 1)}</b>
        <span class="plate">${item.info?.plat || 'NO PLAT'}</span>
      </div>
      <div class="mu" style="margin-top:4px;">KM: ${(item.km||0).toLocaleString('id-ID')} km</div>
    </div>`;
  });

  v.innerHTML = html;

  $('#addBtn')?.addEventListener('click', () => {
    const name = prompt('Nama Kendaraan (mis: Yamaha NMAX):');
    if (!name) return;
    const plat = prompt('Nomor Plat (mis: B 1234 XYZ):');
    if (!R.vehicles) R.vehicles = [];
    R.vehicles.push({ id: 'v_' + Date.now(), motor: name, km: 0, info: { plat: plat } });
    saveData();
    render();
  });
}

$('#logoBtn').addEventListener('click', loadData);
$('#btnTheme').addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('#btnTheme').textContent = isDark ? '🌙' : '☀️';
});

loadData();
</script>
</body>
</html>
